<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                   initial-scale=1.0"
    >

    <title>Walkabout</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #151515;
            color: white;

            font-family: sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 600px;

            padding: 30px;

            text-align: center;
        }

        h1 {
            margin: 0 0 20px;

            color: #ffd700;

            font-size: 40px;
        }

        p {
            color: #ccc;
            font-size: 18px;
        }

        button {
            padding: 15px 25px;

            font-size: 18px;
            font-weight: bold;

            color: #ffd700;
            background: #30240d;

            border: 2px solid #ffd700;
            border-radius: 12px;

            cursor: pointer;
        }

        button:active {
            background: #ffd700;
            color: #201500;
        }

    </style>
</head>

<body>

<div id="app">

    <h1>WALKABOUT</h1>

    <p>
        Your Walkabout companion is ready.
    </p>

    <button>
        Load Deck
    </button>

</div>

</body>
</html>
