<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Walkabout</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #151515;
            color: white;

            font-family: sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 600px;

            padding: 30px;

            text-align: center;
        }

        h1 {
            margin: 0 0 20px;

            color: #ffd700;

            font-size: 40px;
        }

        p {
            color: #ccc;
            font-size: 18px;
        }

        label {
            display: inline-block;

            padding: 15px 25px;

            margin: 15px 0;

            font-size: 18px;
            font-weight: bold;

            color: #ffd700;
            background: #30240d;

            border: 2px solid #ffd700;
            border-radius: 12px;

            cursor: pointer;
        }

        label:active {
            background: #ffd700;
            color: #201500;
        }

        #deckInput {
            display: none;
        }

        #status {
            margin-top: 15px;

            color: #aaa;

            font-size: 16px;
        }

        #cardPreview {
            display: none;

            max-width: 80vw;
            max-height: 55vh;

            margin: 25px auto;

            border-radius: 8px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.7);
        }

    </style>
</head>

<body>

<div id="app">

    <h1>WALKABOUT</h1>

    <p>
        Choose your tarot deck.
    </p>

    <label for="deckInput">
        Load Deck
    </label>

    <input
        id="deckInput"
        type="file"
        accept=".svg,image/svg+xml"
        multiple
    >

    <div id="status">
        No deck loaded.
    </div>

    <img
        id="cardPreview"
        alt="Deck preview"
    >

</div>


<script>

const deckInput =
    document.getElementById(
        "deckInput"
    );

const status =
    document.getElementById(
        "status"
    );

const cardPreview =
    document.getElementById(
        "cardPreview"
    );


let walkaboutDeck = [];

let walkaboutDeckBack = null;


deckInput.addEventListener(
    "change",
    function () {

        const files =
            [...deckInput.files];


        const svgFiles =
            files.filter(
                file =>
                    file.type === "image/svg+xml" ||
                    file.name
                        .toLowerCase()
                        .endsWith(".svg")
            );


        /*
            The deck should contain:

            78 playable cards
            1 deck back

            The back is the final card
            in your procedural deck.
        */

        if (svgFiles.length !== 79) {

            status.textContent =
                "Expected 79 SVGs " +
                "(78 cards + 1 back), " +
                "but found " +
                svgFiles.length +
                ".";

            cardPreview.style.display =
                "none";

            walkaboutDeck = [];
            walkaboutDeckBack = null;

            return;

        }


        /*
            Your procedural deck uses
            card78.svg as the back.

            We identify it by filename
            for now.
        */

        walkaboutDeckBack =
            svgFiles.find(
                file =>
                    file.name === "card78.svg"
            );


        if (!walkaboutDeckBack) {

            status.textContent =
                "Couldn't find card78.svg " +
                "for the deck back.";

            cardPreview.style.display =
                "none";

            walkaboutDeck = [];

            return;

        }


        /*
            Everything except card78.svg
            is a playable card.
        */

        walkaboutDeck =
            svgFiles.filter(
                file =>
                    file !==
                    walkaboutDeckBack
            );


        console.log(
            "Playable cards:",
            walkaboutDeck
        );

        console.log(
            "Deck back:",
            walkaboutDeckBack
        );


        status.textContent =
            walkaboutDeck.length +
            " cards loaded + deck back.";


        /*
            Preview the deck back.
        */

        const previewURL =
            URL.createObjectURL(
                walkaboutDeckBack
            );


        cardPreview.src =
            previewURL;

        cardPreview.style.display =
            "block";

    }
);

</script>

</body>
</html>
