<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Walkabout SVG Test</title>

    <style>
        body {
            margin: 0;
            padding: 30px;

            background: #151515;
            color: white;

            font-family: sans-serif;
            text-align: center;
        }

        button {
            padding: 15px 25px;

            font-size: 18px;

            color: #ffd700;
            background: #30240d;

            border: 2px solid #ffd700;
            border-radius: 12px;
        }

        #fileInput {
            margin-top: 20px;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }

        #card {
            display: none;

            max-width: 80vw;
            max-height: 60vh;

            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1>WALKABOUT</h1>

<p>SVG loading test</p>

<input
    id="fileInput"
    type="file"
    accept="image/svg+xml,.svg"
>

<div id="status">
    No file selected.
</div>

<img
    id="card"
    alt="Selected SVG"
>


<script>

const fileInput =
    document.getElementById(
        "fileInput"
    );

const status =
    document.getElementById(
        "status"
    );

const card =
    document.getElementById(
        "card"
    );


fileInput.addEventListener(
    "change",
    function () {

        console.log(
            "FILE INPUT CHANGED"
        );


        const file =
            fileInput.files[0];


        console.log(
            "Selected file:",
            file
        );


        if (!file) {

            status.textContent =
                "No file selected.";

            return;

        }


        status.textContent =
            "Selected: " +
            file.name;


        const reader =
            new FileReader();


        reader.onload =
            function () {

                console.log(
                    "FILE READ SUCCESSFULLY"
                );


                console.log(
                    reader.result
                );


                const blob =
                    new Blob(
                        [reader.result],
                        {
                            type:
                                "image/svg+xml"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                card.src =
                    url;

                card.style.display =
                    "block";


                status.textContent =
                    "SVG loaded: " +
                    file.name;

            };


        reader.onerror =
            function () {

                console.error(
                    "FILE READ FAILED",
                    reader.error
                );


                status.textContent =
                    "Could not read file.";

            };


        reader.readAsText(file);

    }
);

</script>

</body>
</html>
