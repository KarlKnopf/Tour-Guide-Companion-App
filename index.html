<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                   initial-scale=1.0"
    >

    <title>Walkabout</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #151515;
            color: white;

            font-family: sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 600px;

            padding: 30px;

            text-align: center;
        }

        h1 {
            margin: 0 0 20px;

            color: #ffd700;

            font-size: 40px;
        }

        p {
            color: #ccc;
            font-size: 18px;
        }

        button,
        label {
            display: inline-block;

            padding: 15px 25px;

            margin: 8px;

            font-size: 18px;
            font-weight: bold;

            color: #ffd700;
            background: #30240d;

            border: 2px solid #ffd700;
            border-radius: 12px;

            cursor: pointer;
        }

        button:active,
        label:active {
            background: #ffd700;
            color: #201500;
        }

        #deckInput {
            display: none;
        }

        #cardDisplay {
            display: none;

            max-width: 90vw;
            max-height: 60vh;

            width: auto;
            height: auto;

            margin: 20px auto;

            border-radius: 8px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.7);
        }

        #status {
            margin-top: 15px;

            color: #aaa;

            font-size: 15px;
        }

    </style>
</head>

<body>

<div id="app">

    <h1>WALKABOUT</h1>

    <p>
        Load a card to test your deck.
    </p>


    <label for="deckInput">
        Load SVG Card
    </label>

    <input
        id="deckInput"
        type="file"
        accept=".svg,image/svg+xml"
    >


    <img
        id="cardDisplay"
        alt="Selected Walkabout card"
    >


    <div id="status">
        No card loaded.
    </div>

</div>


<script>

const deckInput =
    document.getElementById(
        "deckInput"
    );

const cardDisplay =
    document.getElementById(
        "cardDisplay"
    );

const status =
    document.getElementById(
        "status"
    );


deckInput.addEventListener(
    "change",
    function () {

        const file =
            deckInput.files[0];

        if (!file) {
            return;
        }


        const imageURL =
            URL.createObjectURL(file);


        cardDisplay.src =
            imageURL;

        cardDisplay.style.display =
            "block";


        status.textContent =
            "Loaded: " + file.name;

    }
);

</script>

</body>
</html>
